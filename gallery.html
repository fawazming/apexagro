<body class="antialiased">

<div id="spinner" class="spinner-screen" aria-hidden="true">
  <div class="spin-ring"><img src="img/optimized/logo-white.png" alt="Apex Globatech Agro logo" width="52" height="52"></div>
  <div class="spinner-bar"><span></span></div>
  <p>Apex Globatech Agro</p>
</div>

<header id="site-header"></header>

<section class="hero relative text-white overflow-hidden">
  <div class="absolute inset-0 leaf-pattern opacity-40"></div>
  <div class="relative max-w-7xl mx-auto px-5 sm:px-8 pt-32 pb-20">
    <nav class="text-sm text-white/80 mb-4" aria-label="Breadcrumb">
      <a href="index.html" class="hover:text-gold">Home</a> <span class="mx-1">/</span> <span class="text-gold">Gallery</span>
    </nav>
    <h1 class="text-4xl lg:text-5xl font-bold">Farm Gallery</h1>
    <p class="text-white/85 text-lg mt-4 max-w-2xl">A glimpse into the quality and care behind every planting material.</p>
  </div>
</section>

<section class="py-20 bg-ivory" x-data="{ lightbox: null }">
  <div class="max-w-7xl mx-auto px-5 sm:px-8">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4" x-data="{ imgs: [
      {s:'img/optimized/pineapple_nursery_ready_for_transplant.jpg', a:'Pineapple nursery ready for transplant', w:287, h:510},
      {s:'img/optimized/pineapple_harvest.jpg', a:'Pineapple harvest', w:287, h:510},
      {s:'img/optimized/pineapple_plantation_farm.jpg', a:'Pineapple plantation farm', w:287, h:510},
      {s:'img/optimized/plantain_sucker_showcase.jpg', a:'Plantain sucker showcase', w:287, h:510},
      {s:'img/optimized/plantain_sucker_ready_for_sale.jpg', a:'Plantain suckers ready for sale', w:637, h:510},
      {s:'img/optimized/plantain_plantation.jpg', a:'Plantain plantation', w:680, h:382}
    ] }">
      <template x-for="(im,i) in imgs" :key="i">
        <button @click="lightbox = im" class="group relative overflow-hidden rounded-2xl reveal" :aria-label="'View ' + im.a">
          <img :src="im.s" :alt="im.a" :width="im.w" :height="im.h" loading="lazy" class="w-full h-64 object-cover transition duration-500 group-hover:scale-105">
          <div class="absolute inset-0 bg-forest/0 group-hover:bg-forest/30 transition flex items-end justify-center pb-4 opacity-0 group-hover:opacity-100">
            <span class="bg-white/90 text-forest text-sm font-heading font-medium px-4 py-1.5 rounded-full">View</span>
          </div>
        </button>
      </template>
    </div>
  </div>

  <!-- Lightbox -->
  <div x-show="lightbox" x-cloak @keydown.escape.window="lightbox=null" class="fixed inset-0 z-[90] bg-black/85 flex items-center justify-center p-4" x-transition.opacity>
    <button @click="lightbox=null" class="absolute top-5 right-5 text-white text-3xl w-10 h-10 rounded-full hover:bg-white/20 flex items-center justify-center" aria-label="Close">×</button>
    <figure class="max-w-4xl w-full">
      <img x-show="lightbox" :src="lightbox ? lightbox.s : ''" :alt="lightbox ? lightbox.a : ''" class="max-h-[80vh] w-auto mx-auto rounded-xl shadow-2xl">
      <figcaption x-text="lightbox ? lightbox.a : ''" class="text-center text-white mt-4 font-heading"></figcaption>
    </figure>
  </div>
</section>

<section class="py-16 bg-forest text-white text-center">
  <div class="max-w-3xl mx-auto px-5 sm:px-8">
    <h2 class="text-2xl lg:text-3xl font-bold mb-4">See Our Quality First-Hand</h2>
    <p class="text-white/85 mb-8">Visit our farm in Remo Sagamu or contact us to arrange a visit.</p>
    <a href="contact.html" class="btn-gold rounded-full px-8 py-3.5 inline-flex items-center gap-2">Contact Us</a>
  </div>
</section>
